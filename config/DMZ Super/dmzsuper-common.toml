			ueMasteredEnableCalmParticles = false

["Ultra Instinct Settings"]
	#If true, UI Mastered cannot be activated if the player has any Rage (from UE).
	restrictUIMasteredWithRage = true
	#Mastery gain per second for Ultra Instinct when active.
	#Range: 0.0 ~ 100.0
	uiMasteryGainPerSecond = 0.02
	#Mastery gain for Ultra Instinct when successfully dodging an attack.
	#Range: 0.0 ~ 100.0
	uiDodgeMasteryGain = 0.5
	#If true, the Ultra Instinct skill will be granted at level 0 and will require completing a minigame to reach level 1 (0 TP cost for level 1).
	uiMinigameEnabled = true
	#If true, the 'androidbase' form will be treated as a transformation for UI physical exhaustion calculation (applying the penalty).
	#If false, 'androidbase' will be ignored (no penalty), allowing Androids to use UI in base form efficiently.
	androidBaseUIExhaustionAsAForm = false

