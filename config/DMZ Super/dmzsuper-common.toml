
["Ultra Ego Settings"]
	#Rage decay rate per tick (every 20 ticks) when Ultra Ego is inactive.
	#Range: 0.0 ~ 1.0
	rageDecayInactive = 0.05
	#Mastery gain per second for Ultra Ego when active.
	#Range: 0.0 ~ 100.0
	ueMasteryGainPerSecond = 0.01
	#Base Rage drain per tick (at 0% mastery) when Ultra Ego is active. Scales down by up to 99% with mastery. Note: This subtracts from the total Rage pool (2.5 or 3.5), it is not a percentage.
	#1 second = 20 ticks
	#Range: 0.0 ~ 1.0
	ueBaseRageDrain = 0.002
	#Mastery gain for Ultra Ego when taking damage.
	#Range: 0.0 ~ 100.0
	ueHurtMasteryGain = 0.02
	#Cooldown in seconds for Ultra Ego after de-transforming due to 0 Rage.
	#Range: 0 ~ 3600
	ueCooldownSeconds = 20
	#If true, the Ultra Ego skill will be granted at level 0 and will require completing a minigame to reach level 1 (0 TP cost for level 1).
	ueMinigameEnabled = true

	["Ultra Ego Settings"."Ultra Ego Customization"]
		#Base multiplier for Ultra Ego Sign (0% mastery)
		#Range: 1.0 ~ 1000.0
		ueBaseMultiplierSign = 4.0
		#Max multiplier for Ultra Ego Sign (100% mastery)
		#Range: 1.0 ~ 1000.0
		ueMaxMultiplierSign = 9.0
		#Base RES multiplier for Ultra Ego Sign (0% mastery)
		#Note: The base DragonMineZ mod adds +0.3 to this stat.
		#Range: 0.01 ~ 1000.0
		ueBaseResMultiplierSign = 1.0
		#Max RES multiplier for Ultra Ego Sign (100% mastery)
		#Note: The base DragonMineZ mod adds +0.3 to this stat.
		#Range: 0.01 ~ 1000.0
		ueMaxResMultiplierSign = 1.0
		#Max multiplier bonus from Rage for Ultra Ego Sign
		#Range: 0.0 ~ 1000.0
		ueMaxRageBonusSign = 2.5
		#Base multiplier for Ultra Ego Mastered (0% mastery)
		#Range: 1.0 ~ 1000.0
		ueBaseMultiplierMastered = 6.0
		#Max multiplier for Ultra Ego Mastered (100% mastery)
		#Range: 1.0 ~ 1000.0
		ueMaxMultiplierMastered = 14.0
		#Base RES multiplier for Ultra Ego Mastered (0% mastery)
		#Note: The base DragonMineZ mod adds +0.3 to this stat.
		#Range: 0.01 ~ 1000.0
		ueBaseResMultiplierMastered = 1.0
		#Max RES multiplier for Ultra Ego Mastered (100% mastery)
		#Note: The base DragonMineZ mod adds +0.3 to this stat.
		#Range: 0.01 ~ 1000.0
		ueMaxResMultiplierMastered = 1.0
		#Max multiplier bonus from Rage for Ultra Ego Mastered
		#Range: 0.0 ~ 1000.0
		ueMaxRageBonusMastered = 3.5

