#
# End Dimension Strength - CMI aliases
#
# LegacyMechanics owns End dragon spawn/clear in Java.
# Do NOT call CNPC triggers 50/51 — those scripts are stubs and no-op.
#
# /enddragon · /spawndragon  -> lmdo enddragon spawn
# /cleardragons · /killdragons -> lmdo enddragon clear
#
# Requires: LegacyMechanics + LegacyMechanicsGUI 2.3.47+
#

CustomAlias:
  enddragon:
    Cmds:
    - asOp! lmdo enddragon spawn
    AddTabs: true
    ExactMatch: true
  spawndragon:
    Cmds:
    - asOp! lmdo enddragon spawn
    AddTabs: true
    ExactMatch: true
  cleardragons:
    Cmds:
    - asOp! lmdo enddragon clear
    AddTabs: true
    ExactMatch: true
  killdragons:
    Cmds:
    - asOp! lmdo enddragon clear
    AddTabs: true
    ExactMatch: true
