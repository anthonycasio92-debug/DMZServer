side = "BOTH"

[[dependencies.dmz_adaptive_difficulty]]
modId = "dragonminez"
mandatory = true
versionRange = "[2.1,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.dmz_adaptive_difficulty]]
modId = "lightmanscurrency"
