modLoader = "javafml"
loaderVersion = "[47,)"
license = "MIT"

[[mods]]
modId = "dmz_adaptive_difficulty"
version = "1.7.0"
displayName = "DMZ Adaptive Difficulty"
authors = "DBZ Legacy Reborn"
displayTest = "IGNORE_SERVER_VERSION"
description = '''
Server-side adaptive difficulty for DragonMineZ.
Clients do not need this mod. /difficulty opens a CMI/CMILib
inventory GUI (chest/chat fallback). FTB Teams, Lightman's
wallet/bank/inventory coins, enemy scaling, elites, mutations,
AI, boss phases, rewards.
'''

[[mixins]]
config = "dmz_adaptive_difficulty.mixins.json"

[[dependencies.dmz_adaptive_difficulty]]
modId = "forge"
mandatory = true
versionRange = "[47,)"
ordering = "NONE"
side = "SERVER"

[[dependencies.dmz_adaptive_difficulty]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.1,1.20.2)"
ordering = "NONE"
side = "SERVER"

[[dependencies.dmz_adaptive_difficulty]]
modId = "dragonminez"
mandatory = true
versionRange = "[2.1,)"
ordering = "AFTER"
side = "SERVER"

[[dependencies.dmz_adaptive_difficulty]]
modId = "lightmanscurrency"
mandatory = false
versionRange = "[0,)"
ordering = "AFTER"
side = "SERVER"

[[dependencies.dmz_adaptive_difficulty]]
modId = "ftbteams"
mandatory = false
versionRange = "[0,)"
ordering = "AFTER"
side = "SERVER"
