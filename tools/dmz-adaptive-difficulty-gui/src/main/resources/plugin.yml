name: LegacyMechanicsGUI
version: '2.3.12'
main: com.dbzlegacy.adaptivedifficulty.bukkit.AdaptiveDifficultyGuiPlugin
api-version: '1.20'
author: DBZ Legacy Reborn
description: CMI/CMILib inventory GUIs (Difficulty · Rival · Spar · Hub · Progression · Prestige · Skills) + PlaceholderAPI for LegacyMechanics
softdepend: [CMILib, CMI, PlaceholderAPI]
commands:
  difficulty:
    description: Open LegacyMechanics Difficulty GUI
    usage: /difficulty
    aliases: [adifficulty, dmzdifficulty, adaptivedifficulty, legacymechanicsdiff]
  rival:
    description: Open LegacyMechanics Rival CMI/chest GUI
    usage: /rival
    aliases: [rivals, rivalry]
  spar:
    description: Open LegacyMechanics Sparring CMI/chest GUI
    usage: /spar
    aliases: [sparring, sparr]
  lm:
    description: Open LegacyMechanics Hub GUI
    usage: /lm
    aliases: [legacymechanics]
  progression:
    description: Progression command tree (GUI · boost · android · meditation · flags)
    usage: /progression [help|status|gui|boost|android|meditation|admin|…]
    aliases: [prog]
  prestige:
    description: Open LegacyMechanics Prestige GUI (staff)
    usage: /prestige
  skills:
    description: Open LegacyMechanics Skills admin GUI (staff)
    usage: /skills
  skillcheck:
    description: Open Skill Check GUI (donator)
    usage: /skillcheck
  dmzdiffgui:
    description: Force-open LegacyMechanics chest/CMI GUI
    usage: /dmzdiffgui [page]
    aliases: [adiffgui, lmgui, legacymechanicsgui]
permissions:
  dmzdiff.gui:
    description: Open the LegacyMechanics GUI
    default: true
  difficulty.admin:
    description: Use LegacyMechanics admin commands (op or this node)
    default: op
  legacymechanics.skillcheck:
    description: Open Skill Check UI (donator)
    default: false
