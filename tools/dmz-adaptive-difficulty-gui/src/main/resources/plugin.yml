name: LegacyMechanicsGUI
version: '4.5.89'
main: com.dbzlegacy.adaptivedifficulty.bukkit.AdaptiveDifficultyGuiPlugin
api-version: '1.20'
author: DBZ Legacy Reborn
description: CMI/CMILib inventory GUIs (Difficulty · Rival · Spar · Hub · Progression · Prestige · Skills) + PlaceholderAPI for LegacyMechanics
softdepend: [CMILib, CMI, PlaceholderAPI]
commands:
  difficulty:
    description: Open LegacyMechanics Difficulty GUI
    usage: /difficulty
    aliases: [diff]
  rival:
    description: Open LegacyMechanics Rival CMI/chest GUI
    usage: /rival
  spar:
    description: Open LegacyMechanics Sparring CMI/chest GUI
    usage: /spar
    aliases: [sparring]
  lm:
    description: Open LegacyMechanics Hub GUI
    usage: /lm
    aliases: [legacymechanics]
  prestige:
    description: Prestige GUI (staff slash; players use /lm → Prestige)
    usage: /prestige
  padmin:
    description: Prestige admin tools (staff / console)
    usage: /padmin points <player> set|add|remove <n>
    aliases: [prestigeadmin]
  progression:
    description: Players — /progression meditation only; staff — full tree; console — boost + android
    usage: /progression meditation | android <player> | boost …
    aliases: [prog]
  androidify:
    description: Console/Saga Dr. Gero android conversion (LegacyMechanics)
    usage: /androidify <player>
    aliases: [androidification]
  skills:
    description: Open LegacyMechanics Skills admin GUI (staff)
    usage: /skills
    permission: difficulty.admin
    permission-message: "§cStaff only."
  skillcheck:
    description: Open Skill Check GUI (donator)
    usage: /skillcheck
    permission: legacymechanics.skillcheck
    permission-message: "§cNo permission: legacymechanics.skillcheck"
  lmdo:
    description: Internal LegacyMechanics GUI action bridge (CMI clicks — not for players)
    usage: /lmdo <rival|spar|difficulty|lm|progression|prestige|skills|skillcheck> <action> [arg] [page]
permissions:
  dmzdiff.gui:
    description: Legacy node (unused for open). Player GUIs are open to all; admin still needs difficulty.admin / op.
    default: true
  difficulty.admin:
    description: Use LegacyMechanics admin commands (op or this node)
    default: op
  legacymechanics.skillcheck:
    description: Open Skill Check UI (donator)
    default: false
  legacymechanics.character.services:
    description: Open Character Services (race / class / reskin / head parts) from /lm
    default: true
  legacymechanics.character.racechange:
    description: Use race change
    default: true
  legacymechanics.character.classchange:
    description: Use class change
    default: true
  legacymechanics.character.reskin:
    description: Use reskin (DMZ recustomize)
    default: true
  legacymechanics.character.headbones:
    description: Use Head Parts Shop (cross-race cosmetic head bones under Reskin)
    default: true
  legacymechanics.character.bypass.cost:
    description: Skip Ancient Coin charges for character services
    default: op
  legacymechanics.character.bypass.cooldown:
    description: Skip character service cooldowns
    default: op
  legacymechanics.character.admin:
    description: Full character services admin bypass
    default: op
