name: AdaptiveDifficultyGUI
version: '1.0.20'
main: com.dbzlegacy.adaptivedifficulty.bukkit.AdaptiveDifficultyGuiPlugin
api-version: '1.20'
author: DBZ Legacy Reborn
description: CMI/CMILib inventory GUI + PlaceholderAPI bridge for AdaptiveDifficulty
softdepend: [CMILib, CMI, PlaceholderAPI]
commands:
  difficulty:
    description: Open AdaptiveDifficulty GUI
    usage: /difficulty
    aliases: [adifficulty, dmzdifficulty, adaptivedifficulty]
  dmzdiffgui:
    description: Force-open AdaptiveDifficulty chest/CMI GUI
    usage: /dmzdiffgui [page]
    aliases: [adiffgui]
permissions:
  dmzdiff.gui:
    description: Open the AdaptiveDifficulty GUI
    default: true
  difficulty.admin:
    description: Use AdaptiveDifficulty admin commands (op or this node)
    default: op
