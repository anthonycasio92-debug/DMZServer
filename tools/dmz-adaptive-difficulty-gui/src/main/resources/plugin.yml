name: DMZAdaptiveDifficultyGUI
version: '3.3.6'
main: com.dbzlegacy.adaptivedifficulty.bukkit.AdaptiveDifficultyGuiPlugin
api-version: '1.20'
author: DBZ Legacy Reborn
description: CMI/CMILib inventory GUI + PlaceholderAPI bridge for DMZ Adaptive Difficulty
softdepend: [CMILib, CMI, PlaceholderAPI]
commands:
  difficulty:
    description: Open adaptive difficulty GUI
    usage: /difficulty
    aliases: [adifficulty, dmzdifficulty]
  dmzdiffgui:
    description: Force-open adaptive difficulty chest/CMI GUI
    usage: /dmzdiffgui [page]
permissions:
  dmzdiff.gui:
    description: Open the adaptive difficulty GUI
    default: true
  difficulty.admin:
    description: Use adaptive difficulty admin commands (op or this node)
    default: op
