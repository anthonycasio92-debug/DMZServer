name: DMZAdaptiveDifficultyGUI
version: '1.5.0'
main: com.dbzlegacy.adaptivedifficulty.bukkit.AdaptiveDifficultyGuiPlugin
api-version: '1.20'
author: DBZ Legacy Reborn
description: Chest GUI + PlaceholderAPI bridge for DMZ Adaptive Difficulty
softdepend: [PlaceholderAPI]
commands:
  dmzdiffgui:
    description: Open adaptive difficulty chest GUI
    usage: /dmzdiffgui [page]
    permission: dmzdiff.gui
permissions:
  dmzdiff.gui:
    description: Open the adaptive difficulty chest GUI
    default: true
